<!-- file: admin.html - Secure Admin Panel with Separate Login -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveSync Admin | Secure Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #0a0a1a;
            min-height: 100vh;
            padding: 20px;
        }

        .admin-container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Login Screen */
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a1a, #1a1a3e);
        }

        .login-card {
            background: #1a1a3e;
            border-radius: 48px;
            padding: 48px 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            border: 1px solid #e94560;
        }

        .login-card h2 {
            color: #ffd966;
            font-size: 2rem;
            margin-bottom: 30px;
            text-align: center;
        }

        .login-card .input-group {
            margin-bottom: 24px;
        }

        .login-card label {
            display: block;
            color: #ccc;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .login-card input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 40px;
            border: 1px solid #2a2a5a;
            background: #0f0f2a;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .login-card input:focus {
            border-color: #e94560;
        }

        .login-card button {
            background: #e94560;
            width: 100%;
            padding: 14px;
            margin-top: 10px;
        }

        .error-msg {
            color: #ff8888;
            text-align: center;
            margin-top: 15px;
            font-size: 0.85rem;
        }

        /* Admin Dashboard (hidden until login) */
        .admin-dashboard {
            display: none;
        }

        .header {
            background: linear-gradient(135deg, #1a1a3e, #16213e);
            padding: 24px 28px;
            border-radius: 28px;
            margin-bottom: 28px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid #e94560;
        }

        .header h1 {
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge {
            background: #e94560;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
        }

        .logout-admin {
            background: #b71c1c;
            padding: 8px 20px;
            border-radius: 40px;
            border: none;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: #1a1a3e;
            border-radius: 24px;
            padding: 20px;
            color: white;
            text-align: center;
            border-left: 5px solid #e94560;
        }

        .stat-card h3 {
            font-size: 2.2rem;
            margin-bottom: 6px;
            color: #ffd966;
        }

        .panel {
            background: #0f0f2a;
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 28px;
            border: 1px solid #2a2a4a;
        }

        .panel h2 {
            color: #ffd966;
            border-left: 6px solid #e94560;
            padding-left: 18px;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1a3a;
            border-radius: 16px;
            overflow: hidden;
        }

        th, td {
            text-align: left;
            padding: 12px 16px;
            border-bottom: 1px solid #2a2a5a;
            font-size: 0.85rem;
        }

        th {
            background: #16213e;
            color: #ffd966;
            font-weight: 600;
        }

        tr:hover {
            background: #252550;
        }

        .password-cell {
            font-family: monospace;
            background: #2a1a3a;
            font-weight: bold;
            color: #ffaa66;
        }

        .action-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .action-REGISTER { background: #2e7d32; color: white; }
        .action-LOGIN { background: #0288d1; color: white; }
        .action-LOVE_CALCULATION { background: #c2185b; color: white; }
        .action-LOGOUT { background: #d32f2f; color: white; }

        .refresh-btn {
            background: #e94560;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 16px;
            transition: 0.2s;
        }

        .refresh-btn:hover {
            background: #ff6b6b;
        }

        .footer {
            text-align: center;
            color: #888;
            margin-top: 32px;
            padding: 20px;
        }

        @media (max-width: 768px) {
            th, td {
                padding: 8px 10px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
<div id="adminRoot"></div>

<script>
    // ==================== ADMIN CREDENTIALS (Separate from main users) ====================
    const ADMIN_KEY = 'lovesync_admin_credentials';
    const ADMIN_SESSION_KEY = 'lovesync_admin_session';
    
    // Default admin credentials (can be changed, but for first run)
    // Admin ID: admin@lovesync.com , Password: Admin@123
    function getAdminCredentials() {
        const stored = localStorage.getItem(ADMIN_KEY);
        if (stored) {
            return JSON.parse(stored);
        }
        // Default admin account
        const defaultAdmin = {
            id: "admin@lovesync.com",
            password: "Admin@123"
        };
        localStorage.setItem(ADMIN_KEY, JSON.stringify(defaultAdmin));
        return defaultAdmin;
    }

    function isAdminLoggedIn() {
        const sess = localStorage.getItem(ADMIN_SESSION_KEY);
        return sess ? JSON.parse(sess).loggedIn : false;
    }

    function setAdminSession(loggedIn) {
        localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify({ loggedIn, timestamp: Date.now() }));
    }

    function logoutAdmin() {
        setAdminSession(false);
        renderAdminLogin();
    }

    // ==================== DATA KEYS (same as main website) ====================
    const USERS_KEY = 'lovesync_users_detailed';
    const ACTIVITY_KEY = 'lovesync_activity_detailed';
    const LOVE_HISTORY_KEY = 'lovesync_love_history';

    function getUsers() {
        const data = localStorage.getItem(USERS_KEY);
        return data ? JSON.parse(data) : [];
    }

    function getActivity() {
        const data = localStorage.getItem(ACTIVITY_KEY);
        return data ? JSON.parse(data) : [];
    }

    function getLoveHistory() {
        const data = localStorage.getItem(LOVE_HISTORY_KEY);
        return data ? JSON.parse(data) : [];
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // ==================== RENDER ADMIN DASHBOARD ====================
    function renderAdminDashboard() {
        const root = document.getElementById('adminRoot');
        root.innerHTML = `
            <div class="admin-container">
                <div class="header">
                    <h1>🔐 LoveSync Admin Panel <span class="badge">Complete Details</span></h1>
                    <div>
                        <button class="logout-admin" id="adminLogoutBtn">🚪 Admin Logout</button>
                    </div>
                </div>

                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card"><h3 id="totalUsers">0</h3><span>👥 Total Registered Users</span></div>
                    <div class="stat-card"><h3 id="totalCalculations">0</h3><span>💞 Love Calculations</span></div>
                    <div class="stat-card"><h3 id="totalLogins">0</h3><span>🔓 Total Login Events</span></div>
                    <div class="stat-card"><h3 id="totalRegs">0</h3><span>📝 Registrations</span></div>
                </div>

                <!-- USERS TABLE WITH ALL DETAILS -->
                <div class="panel">
                    <h2>📋 Registered Users (ID, Password, Partner Names, Love History)</h2>
                    <div class="table-wrapper">
                        <table id="usersTable">
                            <thead>
                                <tr>
                                    <th>Full Name</th>
                                    <th>Email (Login ID)</th>
                                    <th>Password</th>
                                    <th>Registered At</th>
                                    <th>Partner Names (Recent)</th>
                                    <th>Last Love %</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody">
                                <tr><td colspan="6">Loading users...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- LOVE CALCULATIONS -->
                <div class="panel">
                    <h2>💖 All Love Calculations (Partner Name, Percentage, Psychology, Cycle)</h2>
                    <div class="table-wrapper">
                        <table id="loveTable">
                            <thead>
                                <tr>
                                    <th>User Email</th>
                                    <th>Your Name</th>
                                    <th>Partner Name</th>
                                    <th>Love %</th>
                                    <th>Psychology Message</th>
                                    <th>Love Cycle</th>
                                    <th>Timestamp</th>
                                </tr>
                            </thead>
                            <tbody id="loveTableBody">
                                <tr><td colspan="7">No love calculations yet...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- ACTIVITY LOGS -->
                <div class="panel">
                    <h2>🕒 Activity Log (Registrations, Logins, Logouts, Love Calculations)</h2>
                    <div class="table-wrapper">
                        <table id="activityTable">
                            <thead>
                                <tr>
                                    <th>User Email</th>
                                    <th>Action</th>
                                    <th>Timestamp</th>
                                    <th>Details</th>
                                </tr>
                            </thead>
                            <tbody id="activityBody">
                                <tr><td colspan="4">Loading activity...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <button class="refresh-btn" id="forceRefreshBtn">⟳ Refresh All Data</button>
                </div>
                <div class="footer">
                    ⚡ Admin Panel shows EVERYTHING: User ID (Email), Password, Partner names, Love percentage, Psychology type, Love Cycle, and all logs.
                </div>
            </div>
        `;

        // Populate data
        refreshAdminData();

        document.getElementById('adminLogoutBtn').addEventListener('click', () => {
            logoutAdmin();
        });

        document.getElementById('forceRefreshBtn').addEventListener('click', () => {
            refreshAdminData();
        });
    }

    function refreshAdminData() {
        const users = getUsers();
        const loveHistory = getLoveHistory();
        const activities = getActivity();

        // Users table
        const tbody = document.getElementById('usersTableBody');
        if (users.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6">📭 No registered users yet.</td></tr>';
        } else {
            tbody.innerHTML = users.map(user => {
                let recentPartners = '—';
                let lastLovePercent = '—';
                if (user.loveCalculations && user.loveCalculations.length > 0) {
                    const partners = user.loveCalculations.slice(-3).map(calc => calc.partnerName).join(', ');
                    recentPartners = partners.substring(0, 40);
                    lastLovePercent = user.loveCalculations[user.loveCalculations.length - 1].percentage + '%';
                }
                return `
                    <tr>
                        <td><strong>${escapeHtml(user.fullname)}</strong></td>
                        <td style="font-family:monospace">${escapeHtml(user.email)}</td>
                        <td class="password-cell">🔑 ${escapeHtml(user.password)}</td>
                        <td>${user.registeredAt || 'N/A'}</td>
                        <td>${recentPartners}</td>
                        <td>${lastLovePercent}</td>
                    </tr>
                `;
            }).join('');
        }

        // Love calculations table
        const loveBody = document.getElementById('loveTableBody');
        if (loveHistory.length === 0) {
            loveBody.innerHTML = '<tr><td colspan="7">💔 No love calculations performed yet.</td></tr>';
        } else {
            loveBody.innerHTML = loveHistory.map(calc => `
                <tr>
                    <td>${escapeHtml(calc.userEmail)}</td>
                    <td>${escapeHtml(calc.yourName)}</td>
                    <td><strong>❤️ ${escapeHtml(calc.partnerName)}</strong></td>
                    <td style="font-size:1.2rem; font-weight:bold; color:#ff8888;">${calc.percentage}%</td>
                    <td style="max-width:300px;">${escapeHtml(calc.psychologyMessage)}</td>
                    <td>${escapeHtml(calc.loveCycle)}</td>
                    <td>${calc.timestamp}</td>
                </tr>
            `).join('');
        }

        // Activity logs
        const activityBody = document.getElementById('activityBody');
        if (activities.length === 0) {
            activityBody.innerHTML = '<tr><td colspan="4">⏳ No activity yet.</td></tr>';
        } else {
            activityBody.innerHTML = activities.map(act => {
                let actionClass = '';
                if (act.action === 'REGISTER') actionClass = 'action-REGISTER';
                else if (act.action === 'LOGIN') actionClass = 'action-LOGIN';
                else if (act.action === 'LOVE_CALCULATION') actionClass = 'action-LOVE_CALCULATION';
                else if (act.action === 'LOGOUT') actionClass = 'action-LOGOUT';
                return `
                    <tr>
                        <td>${escapeHtml(act.email)}</td>
                        <td><span class="action-badge ${actionClass}">${act.action}</span></td>
                        <td>${act.timestamp}</td>
                        <td style="max-width:400px;">${escapeHtml(act.details || '—')}</td>
                    </tr>
                `;
            }).join('');
        }

        // Update stats
        const totalUsers = users.length;
        const loginCount = activities.filter(a => a.action === 'LOGIN').length;
        const registerCount = activities.filter(a => a.action === 'REGISTER').length;
        const loveCalcCount = activities.filter(a => a.action === 'LOVE_CALCULATION').length;
        
        document.getElementById('totalUsers').innerText = totalUsers;
        document.getElementById('totalCalculations').innerText = loveCalcCount + loveHistory.length;
        document.getElementById('totalLogins').innerText = loginCount;
        document.getElementById('totalRegs').innerText = registerCount;
    }

    // ==================== ADMIN LOGIN SCREEN ====================
    function renderAdminLogin() {
        const root = document.getElementById('adminRoot');
        root.innerHTML = `
            <div class="login-screen">
                <div class="login-card">
                    <h2>🔐 Admin Login</h2>
                    <div class="input-group">
                        <label>Admin ID (Email)</label>
                        <input type="email" id="adminId" placeholder="admin@lovesync.com">
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="adminPassword" placeholder="Enter password">
                    </div>
                    <button id="adminLoginBtn">Login to Admin Panel</button>
                    <div id="loginError" class="error-msg"></div>
                    <div class="footer" style="margin-top:20px; color:#888;">
                        Default: admin@lovesync.com / Admin@123
                    </div>
                </div>
            </div>
        `;

        document.getElementById('adminLoginBtn').addEventListener('click', () => {
            const id = document.getElementById('adminId').value.trim();
            const password = document.getElementById('adminPassword').value.trim();
            const adminCreds = getAdminCredentials();
            
            if (id === adminCreds.id && password === adminCreds.password) {
                setAdminSession(true);
                renderAdminDashboard();
            } else {
                document.getElementById('loginError').innerText = 'Invalid Admin ID or Password!';
            }
        });
    }

    // ==================== INIT ====================
    function initAdmin() {
        if (isAdminLoggedIn()) {
            renderAdminDashboard();
        } else {
            renderAdminLogin();
        }
    }

    initAdmin();
</script>
</body>
</html>
